name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build universal bundle
        run: ./scripts/build.sh

      - name: Package universal archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/OpenInAntigravity.app \
            dist/OpenInAntigravity-macOS-universal.zip
          (cd dist && shasum -a 256 OpenInAntigravity-macOS-universal.zip > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/OpenInAntigravity-macOS-universal.zip
            dist/SHA256SUMS.txt
